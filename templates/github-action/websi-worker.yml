# WEBSI-Worker im Repo einer Website (empfohlen).
# Ablegen unter .github/workflows/websi-worker.yml, dazu runner/websi-worker.ts
# aus dem WEBSI-Repo nach .github/websi/websi-worker.ts kopieren.
#
# Läuft nur, wenn WEBSI einen Auftrag anlegt oder Peter nachbessert, und
# verbraucht nur dann Actions-Minuten. Keine API-Kosten:
#   claude  Secret CLAUDE_CODE_OAUTH_TOKEN (einmal lokal `claude setup-token`, nutzt Peters Abo)
# Anderes Modell: Repository-Variable WEBSI_ENGINE (claude | codex) und WEBSI_MODEL.
name: WEBSI-Worker

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: websi-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auftrag:
    # Nur WEBSI-Aufträge, Kommentare nur von Menschen und nicht vom Worker selbst.
    if: >-
      contains(github.event.issue.labels.*.name, 'websi') &&
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' ||
        (github.event.comment.user.type != 'Bot' &&
         !contains(github.event.comment.body, '<!-- websi-worker -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Abhängigkeiten der Website
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Modell bereitstellen
        run: |
          case "${WEBSI_ENGINE:-claude}" in
            claude) npm install -g @anthropic-ai/claude-code ;;
            codex) npm install -g @openai/codex ;;
          esac
        env:
          WEBSI_ENGINE: ${{ vars.WEBSI_ENGINE }}
      - name: Auftrag abarbeiten
        run: node .github/websi/websi-worker.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WEBSI_ENGINE: ${{ vars.WEBSI_ENGINE }}
          WEBSI_MODEL: ${{ vars.WEBSI_MODEL }}
